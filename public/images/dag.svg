<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Investment game DAG">
  <style>
    .label { font-family: Georgia, serif; font-size: 16px; fill: #1c2733; text-anchor: middle; }
    .sub { font-family: Georgia, serif; font-size: 12px; fill: #5b6b7b; text-anchor: middle; }
    .edge { stroke: #1c2733; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c2733" />
    </marker>
  </defs>

  <ellipse cx="90" cy="150" rx="58" ry="36" fill="#fff" stroke="#1c2733" stroke-width="2" />
  <text class="label" x="90" y="146">W€</text>
  <text class="sub" x="90" y="166">buy-in</text>

  <rect x="210" y="114" width="120" height="72" rx="4" fill="#fff" stroke="#155e8f" stroke-width="2.5" />
  <text class="label" x="270" y="146">f</text>
  <text class="sub" x="270" y="166">stake (decision)</text>

  <ellipse cx="430" cy="80" rx="58" ry="36" fill="#fff" stroke="#1c2733" stroke-width="2" />
  <text class="label" x="430" y="76">Cœ</text>
  <text class="sub" x="430" y="96">fair coin</text>

  <ellipse cx="430" cy="210" rx="64" ry="40" fill="#fff" stroke="#1c2733" stroke-width="2" />
  <text class="label" x="430" y="206">Wœ</text>
  <text class="sub" x="430" y="226">wealth</text>

  <ellipse cx="630" cy="150" rx="64" ry="40" fill="#fff" stroke="#1c2733" stroke-width="2" />
  <text class="label" x="630" y="146">W_T</text>
  <text class="sub" x="630" y="166">final wealth</text>

  <path class="edge" d="M 148 150 L 208 150" />
  <path class="edge" d="M 330 150 L 372 150 L 372 210 L 364 210" />
  <path class="edge" d="M 330 128 L 372 128 L 372 80 L 370 80" />
  <path class="edge" d="M 488 80 L 560 80 L 560 130" />
  <path class="edge" d="M 494 210 L 560 210 L 560 170" />
  <path class="edge" d="M 270 114 L 270 80 L 370 80" />
</svg>
